# C++ / TensorRT 推理节点（实验原型）
# 目的：验证把 yolo 推理从 Python 挪到 C++ 后单帧耗时能否压到 25 ms 以内。
# 不影响 usv_vision 现有功能，可单独起、单独测。

/**:
  ros__parameters:
    sensor_name: "front"
    camera_id: "front"

    # 输入：采集端分发的算法图（640×512）；内参用相机标定
    image_topic: ""            # 空= /sensors/camera/<sensor>/image_algo
    camera_info_topic: ""      # 空= /sensors/camera/<sensor>/camera_info_algo

    # 输出：与 Python 版同名同字段，便于对照
    detections_topic: ""
    objects_topic: ""
    status_topic: ""
    annotated_topic: ""

    engine_path: "/home/nvidia/usv_ws_test/model/jetson/yolo11n_fp16_640.engine"

    # 类别表（COCO 80）；改模型时同步替换
    class_names: [
      "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light",
      "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow",
      "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee",
      "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard",
      "tennis racket", "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple",
      "sandwich", "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch",
      "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard",
      "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator", "book", "clock", "vase",
      "scissors", "teddy bear", "hair drier", "toothbrush"
    ]
    class_name_allowlist: ["boat"]   # 空=不过滤

    conf_threshold: 0.40
    iou_threshold: 0.55
    max_det: 20

    # 输出坐标基准（与 Python 版一致：bbox 换算回原生分辨率）
    reference_width: 1920
    reference_height: 1536

    # 角度：pinhole | scaramuzza（鱼眼，需要 camera_info 的 distortion_model=scaramuzza）
    angle_model: "scaramuzza"

    publish_annotated: false
    publish_legacy_targets: true

    timing_log_hz: 1.0       # 单帧耗时日志频率（Python 版硬编码 0.2Hz）
    startup_report_hz: 0.5
    warmup_iters: 5
