# 参数含义与资源影响见: usv_vision/docs/parameters.md
/**:
  ros__parameters:
    sensor_name: "right"
    device_path: "/dev/video1"         # 右置：SDK 01 号相机，对应 /dev/video1
    frame_id: "side_camera_link"
    # 标定模型：pinhole（默认，D 按 plumb_bob）| scaramuzza（MATLAB 鱼眼全向模型，
    # dist_coeffs 存 [a0,a1,a2,a3,a4]，a0≈等效焦距 px）
    camera_model: "scaramuzza"   # 默认鱼眼；针孔相机改回 "pinhole"
    # 标定文件：相对路径按本包 share 目录解析（install/share/<pkg>/config/calib/...），换机器不用改
    camera_info_url: "config/calib/01_140100471890.json"
    width: 1920
    height: 1536
    fps: 30.0
    pixel_format: "UYVY"
    gstreamer_pipeline: ""
    enable_hardware_timestamp: true
    auto_detect_resolution: false
    put_timestamp: false           # 在图上叠加采集时间戳（调试/对时用；开时每帧多一次 putText）
    image_qos_reliability: "best_effort"
    image_qos_depth: 1
    # M3 内置推流：默认关闭，由 launch 的 stream_mode:=internal 注入地址后启用
    enable_internal_stream: false
    stream_rtsp_url: ""            # 空=由 launch 按相机顺序注入 rtsp://127.0.0.1:8554/camN
    stream_bitrate: 4000000
    stream_fps: 30
    stream_iframe_interval: 15
    stream_idr_interval: 30
    stream_preset_level: 1
    stream_control_rate: 1
    # 算法图尺寸：鱼眼径向模型要求等比缩放，1920x1536 对应 640x512
    # 触发式发布：没有订阅者就不发图（不拷贝、不序列化、不写共享内存）
    publish_only_when_subscribed: true
    algo_width: 640
    algo_height: 512
